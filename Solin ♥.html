#veil,#veil2{position:fixed;inset:0;pointer-events:none;transition:opacity 2.5s}
#veil{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.18) 42%,rgba(0,0,0,.72))}
#veil2{opacity:0;background:radial-gradient(ellipse at 50% 55%,rgba(40,0,10,.55),rgba(6,0,3,.82))}
.hm #veil2{opacity:1}
#ask{position:fixed;inset:0;z-index:5;transition:opacity 1s}
.step{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 24px;text-align:center;animation:in 1.6s ease both}
.step.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.sm{margin:0;line-height:2.2;font-size:clamp(15px,4vw,20px);letter-spacing:.5px;opacity:.8}
.nq{margin:0;font-family:"Noto Nastaliq Urdu","Amiri",serif;font-weight:400;font-size:clamp(28px,8vw,50px);line-height:2.3;text-shadow:0 2px 20px rgba(0,0,0,.7)}
.q{margin:0;font-family:"Noto Nastaliq Urdu","Amiri",serif;font-size:clamp(28px,8vw,50px);font-weight:400;line-height:2.3;text-shadow:0 2px 20px rgba(0,0,0,.7)}
.btns{display:flex;gap:18px;align-items:center;justify-content:center;min-height:100px;margin-top:14px}
button{font:inherit;font-size:20px;padding:4px 36px;line-height:2.1;border:1px solid rgba(255,255,255,.55);background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;border-radius:999px;cursor:pointer;transition:transform .3s,background .3s}
button:hover{background:rgba(255,255,255,.18)}
#show{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity 1.5s;z-index:3}
#show.on{opacity:1}
canvas{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 5px rgba(255,130,160,.5));transition:filter 3s,opacity 2.5s}
.done canvas{opacity:.28}
.h{margin-left:.35em;font-size:.8em}
#msg{position:absolute;left:0;right:0;text-align:center;direction:ltr;font-family:-apple-system,system-ui,sans-serif;font-size:clamp(14px,4.2vw,24px);line-height:1.65;color:#fff;text-shadow:0 1px 3px #000,0 0 12px rgba(0,0,0,.95);padding:0 15%;font-style:italic;transition:transform 1.1s ease}
#mw{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(transparent 6%,#000 20%);mask-image:linear-gradient(transparent 6%,#000 20%)}
.l{white-space:pre-wrap;opacity:0;transform:translateY(10px);transition:opacity 1.8s,transform 1.8s}
.n{font-size:1.7em;letter-spacing:2px;margin-bottom:.15em}
.l.in{opacity:1;transform:none}
.fl{position:fixed;bottom:-40px;color:#a30f1c;opacity:.65;pointer-events:none;animation:up linear forwards;z-index:4}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
#snd{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:9;width:38px;height:38px;padding:0;font-size:17px;line-height:36px;border-radius:50%;display:none;font-family:sans-serif}
#snd.on{display:block}#snd.mut{opacity:.45}
</style>
</head>

<div id="photo"></div><div id="veil"></div><div id="veil2"></div>
<div id="ask">
  <div class="step on" id="s1">
    <p class="sm">سڵاو عەسەبی گیان</p>
    <h1 class="nq">ئایا تۆ کچە چاو مەستەکەیت؟</h1>
    <div class="btns"><button id="y1">بەڵێ</button><button id="n1">نەخێر</button></div>
  </div>
  <div class="step" id="s2">
    <h1 class="q">ئایا خۆشت دەوێم؟</h1>
    <div class="btns"><button id="y2">بەڵێ</button><button id="n2">نەخێر</button></div>
  </div>
</div>
<div id="show">
  <canvas id="c"></canvas>
  <div id="mw"><div id="msg"></div></div>
</div>

<script>
const $=id=>document.getElementById(id),ask=$('ask'),show=$('show'),cv=$('c'),ctx=cv.getContext('2d'),msg=$('msg');
let started=false;
// "No" buttons run away, "Yes" grows
[['y1','n1'],['y2','n2']].forEach(([a,b])=>{const y=$(a),n=$(b);let sc=1;
  const d=e=>{e.preventDefault();n.style.transform=`translate(${(Math.random()-.5)*Math.min(innerWidth-140,240)}px,${(Math.random()-.5)*190}px)`;sc=Math.min(sc+.12,1.7);y.style.transform=`scale(${sc})`};
  n.addEventListener('mouseenter',d);n.addEventListener('touchstart',d,{passive:false});n.addEventListener('click',d)});
const bgm=$('bgm'),snd=$('snd');
function music(){bgm.volume=0;const p=bgm.play();if(p&&p.catch)p.catch(()=>{});snd.classList.add('on');
  let v=0;const iv=setInterval(()=>{v=Math.min(.7,v+.035);bgm.volume=v;if(v>=.7)clearInterval(iv)},150)}
snd.onclick=()=>{bgm.muted=!bgm.muted;snd.classList.toggle('mut',bgm.muted)};
$('y1').onclick=()=>{music();$('s1').classList.remove('on');$('s2').classList.add('on')};
$('y2').onclick=()=>{ask.style.opacity=0;setTimeout(()=>ask.style.display='none',1000);document.body.classList.add('hm');show.classList.add('on');start()};

// Heart: 3 rings, 120 points each, ring after ring, drawn once
const SC=[14,15,16],N=120,TXT='I love you',LT=2200,GAP=250,END=SC.length*(LT+GAP)+300;
let items=[],W,H,dpr,fs,CX,CY,t0=0,done=false;
const PAGES=[["Solin", "Gyan Taqnaki Dly mn", "Zorm Xoshawyiii Amawet", "La Pshtm Bet Ta Wa3daknm"], ["Ahenma Je Siaqt Na Dorenm", "Qat Shtek Nakm Dlt Branjet", "la mn Tnha Pshtm bgra Walla", "Hamu Rek waku Awa Abet"], ["Ka petm wtwa Pyawan Abm", "Lagalt Tnha U Tnha to", "La Dlmyit Aw Dly mn", "Je Kasi tya Nabeta"], ["La To Zytr Rek Baqd", "Hardu Chamw Xoshm Awett", "Solin Gyyyyyann To Shyani", "Hamu Shteke Ka Bot bkam"], ["Dlnya Ba Rek awm Ka bom", "Bas Krdui la Estaw Dahtu", "Ta Qyamat Har He men", "to xoshmm awyyii 👀🩶."]];
function playMsg(){const L=PAGES.flat(),limit=H*.9;let i=0;
  (function add(){if(i>=L.length)return;const d=document.createElement('div');d.className='l'+(i===0?' n':'');d.textContent=L[i];const hs=i===0?'♥️':(i<L.length-1?'🩶':'');if(hs){const s=document.createElement('span');s.className='h';s.textContent=hs;d.appendChild(s)}msg.appendChild(d);
    requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('in')));
    const sh=Math.min(0,limit-(msg.offsetTop+msg.offsetHeight));msg.style.transform=`translateY(${sh}px)`;i++;setTimeout(add,1200)})()}
function build(){
  dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  const u=Math.min(W*.9/32,H*.6/29);fs=Math.max(10,u*.95);CX=W/2;CY=H/2-u*2.5;items=[];
  SC.forEach((s,li)=>{const k=u*s/16;
    for(let i=0;i<N;i++){const t=i*Math.PI*2/N,x=16*Math.pow(Math.sin(t),3),
      y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      items.push({x:CX+x*k,y:CY-y*k,li,d:li*(LT+GAP)+i*LT/N})}});
  msg.style.top=(CY-u*3.2)+'px';
}
function frame(now){
  if(!t0)t0=now;const el=now-t0;
  if(!done&&el>END){done=true;show.classList.add('done');playMsg()}
  const rt=el,f=1,
  m=0;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  ctx.font=`bold ${fs}px Arial,Helvetica,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  let cur=-1,lead=null;
  if(f>0)for(const it of items){
    if(rt<it.d)continue;lead=it;
    if(it.li!==cur){cur=it.li;
      ctx.fillStyle=`hsl(${345*(1-m)+355*m},${100*(1-m)+88*m}%,${(86-cur*2.5)*(1-m)+(40-cur*2)*m}%)`}
    ctx.globalAlpha=Math.min(1,(rt-it.d)/300)*f;
    ctx.fillText(TXT,it.x,it.y);
  }
  if(lead&&f===1&&el<END-300){ctx.globalAlpha=1;ctx.shadowColor='#ff6b8a';ctx.shadowBlur=14;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lead.x,lead.y,3,0,7);ctx.fill();ctx.shadowBlur=0}
  requestAnimationFrame(frame);
}
function start(){if(started)return;started=true;build();requestAnimationFrame(frame);
  setInterval(()=>{const e=document.createElement('div');e.className='fl';e.textContent=['♥','♥','❤️'][Math.random()*3|0];
  e.style.left=Math.random()*100+'vw';e.style.fontSize=(14+Math.random()*24)+'px';e.style.animationDuration=(6+Math.random()*6)+'s';
  document.body.appendChild(e);setTimeout(()=>e.remove(),12500)},900)}
addEventListener('resize',()=>{if(started)build()});
</script>
